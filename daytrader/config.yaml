# ------------------------------------------------------------------
# Day-trade scanner configuration
# ------------------------------------------------------------------

# Data source: "alpaca", "schwab", "yfinance" (free, no key) or "auto"
# (Alpaca if its keys are in .env, else Schwab, else Yahoo).
data_source: auto

alpaca:
  # sip_delayed: free plan - full-market bars up to 16 min ago + live IEX bars after
  # sip:         paid Algo Trader Plus - real-time full-market data
  # iex:         IEX exchange only (real-time, thin volume on small caps)
  feed: sip_delayed

schwab:
  token_path: data/schwab_token.json
  callback_url: https://127.0.0.1:8182

# Strategy used by `scan`, `monitor` and the dashboard unless overridden.
# Change it with:  python cli.py switch <name>   (or the dashboard dropdown)
active_strategy: gap_and_go

# --- Universe: which stocks are even considered ----------------------
universe:
  min_price: 1.0
  max_price: 20.0
  min_gap_pct: 5.0            # % change vs previous close to be a "mover"
  min_rel_volume: 2.0         # today's volume vs 10-day avg at same pace
  max_float_millions: 50      # skip filter when float is unknown
  max_candidates: 25          # how many movers to analyse each scan
  # Always included in addition to the live movers list:
  watchlist: []

# --- Risk / sizing (used to show share size on alerts) ----------------
risk:
  account_size: 25000
  risk_per_trade: 100         # $ you're willing to lose if stop is hit
  max_position_pct: 25        # never size above this % of account
  reward_risk: 2.0            # default profit target = entry + R * risk

# --- Exits shared by all strategies -----------------------------------
exits:
  trail_after_r: 1.0          # once +1R, trail stop under 9 EMA (1-min)
  breakeven_after_r: 1.0      # move stop to entry once +1R
  time_exit: "15:50"          # flatten anything still open
  no_new_entries_after: "11:30"   # small-cap momentum fades after morning

# --- Per-strategy parameters (override defaults in code) --------------
strategies:
  gap_and_go:
    min_gap_pct: 10
    min_premarket_volume: 100000
  bull_flag:
    min_day_gain_pct: 10
    max_pullback_bars: 5
    max_retrace_pct: 50
  orb:
    range_minutes: 5
  vwap_reclaim:
    min_gap_pct: 8
  red_to_green:
    min_dip_pct: 2
  oversold_bounce:
    min_flush_pct: 8
    rsi_max: 25

# --- Strategy-switch hint ---------------------------------------------
switch_hint:
  lookback_days: 10           # rolling window used to judge strategies
  min_trades: 5               # need at least this many trades to judge
  # Suggest switching when the active strategy's expectancy (avg R per
  # trade) trails the best one by this much, or goes negative.
  margin_r: 0.15
  # Run the backtest when `monitor` starts and switch automatically if suggested.
  auto_switch: false

# --- Alerts ------------------------------------------------------------
alerts:
  poll_seconds: 60
  desktop_notifications: true # macOS notification centre
  sound: true
  # Phone push via the free ntfy app: set NTFY_TOPIC in .env, then subscribe
  # to that topic in the app. Which alert kinds to push:
  ntfy_kinds: [BUY, SELL, WATCH, INFO]   # INFO = stop moves, start/finish
  ntfy_server: https://ntfy.sh

backtest:
  slippage_pct: 0.1          # per side, small caps have wide spreads
  # market: every listed stock that gapped each day (Alpaca). seen: only
  # symbols from scan history / watchlist / today's movers.
  universe: market
  min_avg_volume: 100000     # skip illiquid names (10-day avg daily volume)
  max_symbols_per_day: 60    # strongest gappers per day to replay

# ======================================================================
# India (NSE F&O stocks). Anything here overrides the US settings above
# for `--market india`. Prices and risk are in rupees.
# ======================================================================
india:
  # auto: Zerodha Kite if KITE_API_KEY/SECRET are in .env and you logged in
  # today (./run.sh --market india auth), else free Yahoo NSE data.
  data_source: auto
  kite:
    redirect_url: http://127.0.0.1:5010/kite   # set the same URL in your Kite app

  active_strategy: gap_and_go

  universe:                   # scanned from the NSE F&O list (~220 stocks)
    min_price: 50
    max_price: 10000
    min_gap_pct: 1.5          # F&O large caps move less than US small caps
    min_rel_volume: 1.2
    max_float_millions: null
    max_candidates: 30
    watchlist: []

  risk:
    account_size: 500000
    risk_per_trade: 2500      # rupees lost if the stop is hit
    max_position_pct: 25
    reward_risk: 2.0

  exits:
    trail_after_r: 1.0
    breakeven_after_r: 1.0
    time_exit: "15:10"        # brokers auto square-off intraday (MIS) ~15:20
    no_new_entries_after: "13:00"

  strategies:
    gap_and_go:
      min_gap_pct: 2
      min_premarket_volume: 0
      open_range_minutes: 5   # NSE has no premarket: break of the first 5-min high
    bull_flag:
      min_day_gain_pct: 2.5
      max_pullback_bars: 5
      max_retrace_pct: 50
      min_pole_pct: 1.2
    orb:
      range_minutes: 15
      min_gap_pct: 1
    vwap_reclaim:
      min_gap_pct: 1.5
    red_to_green:
      min_dip_pct: 1
    oversold_bounce:
      min_flush_pct: 3
      rsi_max: 25
      min_gap_pct: 1

  backtest:
    slippage_pct: 0.08        # per side: slippage + STT/exchange charges
    universe: market          # every F&O stock that gapped each day
    min_avg_volume: 200000
    max_symbols_per_day: 40
